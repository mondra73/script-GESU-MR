name: Actualizar datos GESU

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar script de descarga
        env:
          USERNAME: ${{ secrets.GESU_USERNAME }}
          PASSWORD: ${{ secrets.GESU_PASSWORD }}
        run: node export_completo_combinado.js

      - name: Verificar si se generó el archivo
        run: |
          if [ -f datos_completos.json ]; then
            echo "Archivo generado correctamente"
            ls -lh datos_completos.json
          else
            echo "ERROR: No se generó datos_completos.json"
            exit 1
          fi

      - name: Commit y push del JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_completos.json
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "Actualización automática de datos $(date +'%Y-%m-%d')"
            git push
          fi