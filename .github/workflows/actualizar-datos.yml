name: Actualizar datos GESU

on:
  schedule:
    # 5 AM hora Argentina (UTC-3) = 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar script de descarga
        env:
          USERNAME: ${{ secrets.GESU_USERNAME }}
          PASSWORD: ${{ secrets.GESU_PASSWORD }}
        run: node export_completo_combinado.js

      - name: Commit y push del JSON generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_completos.json
          git diff --staged --quiet || git commit -m "Actualización automática de datos $(date +'%Y-%m-%d %H:%M')"
          git push